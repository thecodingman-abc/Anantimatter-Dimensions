<html>
  <head>
    <title>Anantimatter Dimensions</title>
    <style>
        body {
            margin: 0;
            padding: 50px;
            background-color: #000000;
        }

        /* 공통 상자 스타일 */
        .my-box {
            /* 크기 및 배경 */
            width: 300px;
            height: 150px;
            background-color: #3498db;
            
            /* 글자 스타일 및 가로·세로 정중앙 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            
            /* 시각적 효과 (둥근 모서리, 부드러운 입체 그림자) */
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* [위치 1] 화면 가로 정중앙 배치 */
        .center-position {
            margin: 0 auto;
        }

        /* [위치 2] 원하는 위치만큼 여백(Margin)으로 띄우기 */
        .margin-position {
            margin-top: 50px;
            margin-left: 100px;
            background-color: #2ecc71; /* 구분을 위해 초록색으로 변경 */
        }
    </style>
  </head>
  <body>
   
  </body>
</html>
